services:
  switch-manager:
    build: .
    container_name: switch-manager
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      CSM_ADMIN_USER: ${CSM_ADMIN_USER:-admin}
      CSM_ADMIN_PASSWORD: ${CSM_ADMIN_PASSWORD:-ChangeMeNow!}
      CSM_MASTER_KEY: ${CSM_MASTER_KEY:-}
      CSM_STATUS_INTERVAL_SECONDS: ${CSM_STATUS_INTERVAL_SECONDS:-300}
      CSM_AVAILABILITY_RETENTION_DAYS: ${CSM_AVAILABILITY_RETENTION_DAYS:-30}
      CSM_PORT_POLL_INTERVAL_SECONDS: ${CSM_PORT_POLL_INTERVAL_SECONDS:-900}
      CSM_PORT_HISTORY_RETENTION_DAYS: ${CSM_PORT_HISTORY_RETENTION_DAYS:-30}
      CSM_OPERATOR_USERNAME_PREFIX: ${CSM_OPERATOR_USERNAME_PREFIX:-adm-}
      CSM_OPERATOR_SESSION_MINUTES: ${CSM_OPERATOR_SESSION_MINUTES:-30}
      CSM_SESSION_COOKIE_SECURE: ${CSM_SESSION_COOKIE_SECURE:-false}
      CSM_PURGE_LEGACY_CLI_CREDENTIALS: ${CSM_PURGE_LEGACY_CLI_CREDENTIALS:-true}
      CSM_BACKUP_INTERVAL_HOURS: ${CSM_BACKUP_INTERVAL_HOURS:-24}
      CSM_AUTOMATIC_CLI_BACKUP_ENABLED: ${CSM_AUTOMATIC_CLI_BACKUP_ENABLED:-false}
      CSM_BACKUP_CLI_USER: ${CSM_BACKUP_CLI_USER:-}
      CSM_BACKUP_CLI_PASSWORD: ${CSM_BACKUP_CLI_PASSWORD:-}
      CSM_BACKUP_CLI_SECRET: ${CSM_BACKUP_CLI_SECRET:-}
    volumes:
      - ./data:/app/data
